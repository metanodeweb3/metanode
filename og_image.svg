
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Dark Background Gradients matching site CSS variables -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e11"/>
      <stop offset="50%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12161c"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c853"/>
      <stop offset="50%" stop-color="#69f0ae"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>

    <!-- Subtle Tech Grid Background -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1a1d21" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>

    <!-- Feature Card Background -->
    <linearGradient id="featureCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f131a"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glowing Emerald Orbs -->
  <circle cx="120" cy="120" r="260" fill="#00c853" opacity="0.08"/>
  <circle cx="1080" cy="510" r="300" fill="#00c853" opacity="0.06"/>

  <!-- Main Outer Framed Container Card -->
  <rect x="45" y="45" width="1110" height="540" rx="16" fill="url(#cardBg)" stroke="#222730" stroke-width="1.5"/>
  <rect x="45" y="45" width="1110" height="4" rx="2" fill="url(#accentGlow)"/>

  <!-- Header Navigation Block (Exact replica of metanode.co.uk header) -->
  <g transform="translate(85, 80)">
    
    <!-- Brand Icon Box 'M' (48x48 dark box with glowing green border and Plus Jakarta Sans M) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="52" height="52" rx="12" fill="rgba(0, 200, 83, 0.1)" stroke="#00c853" stroke-width="1.5"/>
      <text x="26" y="37" font-family="Plus Jakarta Sans" font-weight="800" font-size="30" fill="#ffffff" text-anchor="middle">M</text>
    </g>

    <!-- Brand Text Block (Title + Subtitle) -->
    <g transform="translate(68, 4)">
      <!-- Main Header Title: METANODE INFRA -->
      <text x="0" y="24" font-family="Plus Jakarta Sans" font-weight="800" font-size="24" letter-spacing="-0.02em" fill="#ffffff">
        METANODE <tspan fill="#00c853">INFRA</tspan>
      </text>

      <!-- Subtitle: WEB3 DEPIN HARDWARE ENGINE -->
      <text x="0" y="43" font-family="Plus Jakarta Sans" font-weight="700" font-size="10.5" letter-spacing="0.18em" fill="#828a95">
        WEB3 DEPIN HARDWARE ENGINE
      </text>
    </g>

    <!-- Top Right Online Status Badge (High contrast background & crisp green text) -->
    <g transform="translate(765, 6)">
      <rect x="0" y="0" width="230" height="40" rx="8" fill="#0d2417" stroke="#00c853" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="5" fill="#00e676"/>
      <text x="34" y="25" font-family="JetBrains Mono" font-weight="700" font-size="13" fill="#00c853" letter-spacing="0.05em">SYSTEM ONLINE • LIVE DB</text>
    </g>

  </g>

  <!-- Horizontal Section Divider Line -->
  <line x1="85" y1="152" x2="1115" y2="152" stroke="#1d222a" stroke-width="1.5"/>

  <!-- Hero Content Section -->
  <g transform="translate(85, 182)">
    
    <!-- Hero Headline matching site title -->
    <text x="0" y="32" font-family="Plus Jakarta Sans" font-weight="800" font-size="34" letter-spacing="-0.02em" fill="#ffffff">
      Web3 Infrastructure Matcher
    </text>

    <!-- Hero Subtitle Paragraph matching site description -->
    <text x="0" y="68" font-family="Plus Jakarta Sans" font-weight="500" font-size="18" fill="#9ca3af">
      Filter node requirements against server specs (CPU, RAM, NVMe, GPU)
    </text>
    <text x="0" y="94" font-family="Plus Jakarta Sans" font-weight="500" font-size="18" fill="#9ca3af">
      or estimate potential validator yields across top blockchain networks.
    </text>

    <!-- 3 Core Feature Cards (Exact tools from metanode.co.uk site) -->
    <g transform="translate(0, 128)">
      <!-- Card 1: Hardware Matcher -->
      <rect x="0" y="0" width="325" height="88" rx="12" fill="url(#featureCardBg)" stroke="#262d38" stroke-width="1.5"/>
      <text x="20" y="36" font-family="Plus Jakarta Sans" font-weight="800" font-size="16" fill="#ffffff">🖥️ Hardware Matcher</text>
      <text x="20" y="60" font-family="Plus Jakarta Sans" font-weight="500" font-size="13.5" fill="#9ca3af">Select CPU, RAM &amp; Storage Specs</text>

      <!-- Card 2: Yield Estimator -->
      <rect x="350" y="0" width="325" height="88" rx="12" fill="url(#featureCardBg)" stroke="#262d38" stroke-width="1.5"/>
      <text x="370" y="36" font-family="Plus Jakarta Sans" font-weight="800" font-size="16" fill="#ffffff">📊 Yield Estimator</text>
      <text x="370" y="60" font-family="Plus Jakarta Sans" font-weight="500" font-size="13.5" fill="#9ca3af">Calculate ROI &amp; Network Rewards</text>

      <!-- Card 3: Validator Matcher -->
      <rect x="700" y="0" width="330" height="88" rx="12" fill="url(#featureCardBg)" stroke="#262d38" stroke-width="1.5"/>
      <text x="720" y="36" font-family="Plus Jakarta Sans" font-weight="800" font-size="16" fill="#ffffff">🛡️ Validator Matcher</text>
      <text x="720" y="60" font-family="Plus Jakarta Sans" font-weight="500" font-size="13.5" fill="#9ca3af">Find Runnable Nodes &amp; DePIN</text>
    </g>

    <!-- Supported Protocols Badges -->
    <g transform="translate(0, 242)">
      <!-- Ethereum -->
      <rect x="0" y="0" width="105" height="32" rx="6" fill="#12161c" stroke="#262d38" stroke-width="1.2"/>
      <text x="52.5" y="20" font-family="Plus Jakarta Sans" font-weight="700" font-size="13.5" fill="#ffffff" text-anchor="middle">Ethereum</text>

      <!-- Solana -->
      <rect x="117" y="0" width="95" height="32" rx="6" fill="#12161c" stroke="#262d38" stroke-width="1.2"/>
      <text x="164.5" y="20" font-family="Plus Jakarta Sans" font-weight="700" font-size="13.5" fill="#ffffff" text-anchor="middle">Solana</text>

      <!-- Akash -->
      <rect x="224" y="0" width="95" height="32" rx="6" fill="#12161c" stroke="#262d38" stroke-width="1.2"/>
      <text x="271.5" y="20" font-family="Plus Jakarta Sans" font-weight="700" font-size="13.5" fill="#ffffff" text-anchor="middle">Akash</text>

      <!-- Render -->
      <rect x="331" y="0" width="95" height="32" rx="6" fill="#12161c" stroke="#262d38" stroke-width="1.2"/>
      <text x="378.5" y="20" font-family="Plus Jakarta Sans" font-weight="700" font-size="13.5" fill="#ffffff" text-anchor="middle">Render</text>

      <!-- Helium -->
      <rect x="438" y="0" width="95" height="32" rx="6" fill="#12161c" stroke="#262d38" stroke-width="1.2"/>
      <text x="485.5" y="20" font-family="Plus Jakarta Sans" font-weight="700" font-size="13.5" fill="#ffffff" text-anchor="middle">Helium</text>

      <!-- Bittensor -->
      <rect x="545" y="0" width="105" height="32" rx="6" fill="#12161c" stroke="#262d38" stroke-width="1.2"/>
      <text x="597.5" y="20" font-family="Plus Jakarta Sans" font-weight="700" font-size="13.5" fill="#ffffff" text-anchor="middle">Bittensor</text>

      <!-- Avalanche -->
      <rect x="662" y="0" width="110" height="32" rx="6" fill="#12161c" stroke="#262d38" stroke-width="1.2"/>
      <text x="717" y="20" font-family="Plus Jakarta Sans" font-weight="700" font-size="13.5" fill="#ffffff" text-anchor="middle">Avalanche</text>

      <!-- + Protocols Badge -->
      <rect x="784" y="0" width="160" height="32" rx="6" fill="#082214" stroke="#00c853" stroke-width="1.2"/>
      <text x="864" y="20" font-family="Plus Jakarta Sans" font-weight="700" font-size="13.5" fill="#00c853" text-anchor="middle">+ Protocol Database</text>
    </g>

  </g>

  <!-- Bottom Footer Line & Exact Domain URL -->
  <g transform="translate(85, 512)">
    <line x1="0" y1="0" x2="1030" y2="0" stroke="#1d222a" stroke-width="1.5"/>
    <text x="0" y="32" font-family="JetBrains Mono" font-weight="700" font-size="16" fill="#00c853">https://metanode.co.uk</text>
    <text x="1030" y="32" font-family="Plus Jakarta Sans" font-weight="500" font-size="13" fill="#6b7280" text-anchor="end">&#169; 2026 Metanode Protocols &#8226; Infrastructure Engine</text>
  </g>

</svg>
